<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0d9488" />
<title>Historia Clínica Nutricional</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .tab-active { background-color: #0d9488; color: white; }
  details > summary { cursor: pointer; }
  textarea { resize: vertical; }
  .spinner {
    border: 3px solid #e5e7eb;
    border-top-color: #0d9488;
    border-radius: 50%;
    width: 28px; height: 28px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="bg-slate-50 min-h-screen">

<!-- ========== Pantalla de carga inicial ========== -->
<div id="loading" class="fixed inset-0 bg-white flex items-center justify-center z-50">
  <div class="text-center">
    <div class="spinner mx-auto mb-3"></div>
    <p class="text-slate-600">Cargando...</p>
  </div>
</div>

<!-- ========== Pantalla de login / registro ========== -->
<div id="vista-login" class="hidden min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-lg shadow-lg max-w-md w-full p-8">
    <h1 class="text-2xl font-bold text-teal-700 mb-2">Historia Clínica Nutricional</h1>
    <p class="text-slate-600 mb-6 text-sm">Ingresá con tu email y contraseña</p>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input id="login-email" type="email" autocomplete="email"
               class="border rounded px-3 py-2 w-full" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
        <input id="login-pass" type="password" autocomplete="current-password"
               class="border rounded px-3 py-2 w-full" />
      </div>
      <p id="login-error" class="text-red-600 text-sm hidden"></p>
      <button id="btn-login" class="w-full bg-teal-700 text-white py-2 rounded font-medium hover:bg-teal-800">
        Iniciar sesión
      </button>
    </div>

    <div class="mt-6 pt-6 border-t text-center text-sm text-slate-600">
      <p class="mb-2">¿Es la primera vez?</p>
      <button id="btn-mostrar-registro" class="text-teal-700 hover:underline">
        Crear cuenta nueva
      </button>
    </div>
  </div>
</div>

<!-- ========== Modal de registro ========== -->
<div id="modal-registro" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded shadow-xl max-w-md w-full p-6">
    <h3 class="text-lg font-bold mb-4">Crear cuenta</h3>
    <div class="space-y-3">
      <input id="reg-email" type="email" placeholder="Email"
             class="border rounded px-3 py-2 w-full" />
      <input id="reg-pass" type="password" placeholder="Contraseña (mínimo 6 caracteres)"
             class="border rounded px-3 py-2 w-full" />
      <p id="reg-msg" class="text-sm hidden"></p>
    </div>
    <div class="flex justify-end gap-2 mt-4">
      <button id="cancelar-registro" class="px-4 py-2 rounded border">Cancelar</button>
      <button id="guardar-registro" class="px-4 py-2 rounded bg-teal-700 text-white">Crear</button>
    </div>
  </div>
</div>

<!-- ========== App principal ========== -->
<div id="app" class="hidden">
  <header class="bg-teal-700 text-white shadow">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between flex-wrap gap-2">
      <h1 class="text-xl font-bold">Historia Clínica Nutricional</h1>
      <div class="flex items-center gap-3 text-sm">
        <span id="usuario-email" class="hidden sm:inline opacity-80"></span>
        <button id="btn-nuevo" class="bg-white text-teal-700 px-3 py-1.5 rounded font-medium hover:bg-teal-50">
          + Nuevo paciente
        </button>
        <button id="btn-logout" class="bg-teal-800 px-3 py-1.5 rounded hover:bg-teal-900">
          Salir
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6">

    <!-- Vista lista -->
    <section id="vista-lista">
      <div class="mb-4">
        <input id="buscador" type="text" placeholder="Buscar paciente..."
               class="border rounded px-3 py-2 w-full" />
      </div>
      <div id="lista-pacientes" class="bg-white rounded shadow divide-y">
        <p class="p-4 text-slate-500">Cargando...</p>
      </div>
    </section>

    <!-- Vista ficha -->
    <section id="vista-ficha" class="hidden">
      <button id="btn-volver" class="mb-4 text-teal-700 hover:underline">← Volver al listado</button>

      <div class="bg-white rounded shadow p-6 mb-4">
        <div class="flex items-start justify-between flex-wrap gap-2">
          <div>
            <h2 id="ficha-nombre" class="text-2xl font-bold"></h2>
            <p id="ficha-resumen" class="text-slate-600 text-sm mt-1"></p>
          </div>
          <div class="flex gap-2 flex-wrap">
            <button id="btn-exportar-hc" class="bg-blue-600 text-white px-3 py-2 rounded text-sm hover:bg-blue-700">
              📄 Exportar HC completa
            </button>
            <button id="btn-eliminar-paciente" class="bg-red-600 text-white px-3 py-2 rounded text-sm hover:bg-red-700">
              🗑 Eliminar
            </button>
          </div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="flex flex-wrap gap-1 mb-4 bg-white rounded shadow p-1">
        <button class="tab-btn px-3 py-2 rounded text-sm" data-tab="datos">Datos personales</button>
        <button class="tab-btn px-3 py-2 rounded text-sm" data-tab="antropo">Antropometría</button>
        <button class="tab-btn px-3 py-2 rounded text-sm" data-tab="lab">Laboratorio</button>
        <button class="tab-btn px-3 py-2 rounded text-sm" data-tab="dia">Día alimentario</button>
        <button class="tab-btn px-3 py-2 rounded text-sm" data-tab="seleccion">Selección de alimentos</button>
        <button class="tab-btn px-3 py-2 rounded text-sm" data-tab="planes">Planes</button>
        <button class="tab-btn px-3 py-2 rounded text-sm" data-tab="stats">Evolución</button>
      </div>

      <div id="tab-datos" class="tab-content bg-white rounded shadow p-6"></div>
      <div id="tab-antropo" class="tab-content bg-white rounded shadow p-6 hidden"></div>
      <div id="tab-lab" class="tab-content bg-white rounded shadow p-6 hidden"></div>
      <div id="tab-dia" class="tab-content bg-white rounded shadow p-6 hidden"></div>
      <div id="tab-seleccion" class="tab-content bg-white rounded shadow p-6 hidden"></div>
      <div id="tab-planes" class="tab-content bg-white rounded shadow p-6 hidden"></div>
      <div id="tab-stats" class="tab-content bg-white rounded shadow p-6 hidden"></div>
    </section>
  </main>
</div>

<!-- Modal nuevo paciente -->
<div id="modal-nuevo" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded shadow-xl max-w-md w-full p-6">
    <h3 class="text-lg font-bold mb-4">Nuevo paciente</h3>
    <input id="nuevo-nombre" type="text" placeholder="Nombre y apellido" class="border rounded px-3 py-2 w-full mb-3" />
    <input id="nuevo-fecha-inicio" type="date" class="border rounded px-3 py-2 w-full mb-4" />
    <p class="text-xs text-slate-500 mb-4">Después podés completar todos los demás datos.</p>
    <div class="flex justify-end gap-2">
      <button id="cancelar-nuevo" class="px-4 py-2 rounded border">Cancelar</button>
      <button id="guardar-nuevo" class="px-4 py-2 rounded bg-teal-700 text-white">Crear</button>
    </div>
  </div>
</div>

<!-- ========== Librerías externas ========== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

<!-- ========== Configuración ========== -->
<script src="config.js"></script>

<!-- ========== Lógica de la app ========== -->
<script src="app.js"></script>

</body>
</html>
